schema: spec-driven
context: |
  This is Luis Albos's static engineering portfolio, served from the
  /engineering-portfolio/ GitHub Pages subpath. The site uses plain HTML,
  CSS, JavaScript, vendored Three.js, a 31-page WebP viewer, a resume page,
  and a Python-generated Study Archive. Follow README.md, AGENTS.md, and
  STARTUP.md. Preserve relative runtime URLs and the existing published site
  until a named overhaul change is approved. Record Design and Engineering
  Council recommendations separately from owner decisions. The owner retains
  product, aesthetic, integration, and release authority.

